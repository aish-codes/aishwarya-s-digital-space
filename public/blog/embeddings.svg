<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #555; }
    .axis-label { font-size: 12px; fill: #888; font-style: italic; }
    .point-label { font-size: 12px; fill: #1a1a1a; }
    .cluster-label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .note { font-size: 12px; fill: #555; }
  </style>

  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">Embeddings: meaning becomes geometry</text>
  <text x="400" y="50" class="subtitle" text-anchor="middle">Sentences with similar meanings sit close together in vector space</text>

  <!-- Plot frame -->
  <rect x="80" y="80" width="640" height="340" fill="#fafafa" stroke="#e4e4e7"/>

  <!-- Axes (simplified — these are conceptual, not real) -->
  <line x1="80"  y1="420" x2="720" y2="420" stroke="#d4d4d8" stroke-width="1"/>
  <line x1="80"  y1="80"  x2="80"  y2="420" stroke="#d4d4d8" stroke-width="1"/>
  <text x="400" y="445" class="axis-label" text-anchor="middle">dimension 1 (of ~1,500)</text>
  <text x="65" y="250" class="axis-label" text-anchor="middle" transform="rotate(-90 65 250)">dimension 2</text>

  <!-- Cluster 1: Password / login (top left) -->
  <circle cx="200" cy="150" r="90" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.3" stroke-dasharray="4 3"/>
  <text x="200" y="105" class="cluster-label" text-anchor="middle" fill="#1e40af">Authentication</text>

  <circle cx="170" cy="155" r="6" fill="#3b82f6"/>
  <text x="180" y="138" class="point-label">"How do I reset my password?"</text>

  <circle cx="220" cy="180" r="6" fill="#3b82f6"/>
  <text x="230" y="200" class="point-label">"I forgot my login credentials"</text>

  <circle cx="195" cy="125" r="6" fill="#3b82f6"/>
  <text x="205" y="118" class="point-label">"Can't sign in to my account"</text>

  <!-- Cluster 2: HR / leave (top right) -->
  <circle cx="560" cy="180" r="90" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-dasharray="4 3"/>
  <text x="560" y="120" class="cluster-label" text-anchor="middle" fill="#065f46">HR / Time off</text>

  <circle cx="540" cy="190" r="6" fill="#10b981"/>
  <text x="425" y="195" class="point-label" text-anchor="end">"What's our PTO policy?"</text>

  <circle cx="585" cy="160" r="6" fill="#10b981"/>
  <text x="595" y="155" class="point-label">"How many vacation days do I get?"</text>

  <circle cx="555" cy="220" r="6" fill="#10b981"/>
  <text x="565" y="240" class="point-label">"Can I take maternity leave next month?"</text>

  <!-- Cluster 3: Sales / revenue (bottom right) -->
  <circle cx="540" cy="350" r="80" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.3" stroke-dasharray="4 3"/>
  <text x="540" y="408" class="cluster-label" text-anchor="middle" fill="#92400e">Sales metrics</text>

  <circle cx="520" cy="330" r="6" fill="#f59e0b"/>
  <text x="510" y="320" class="point-label" text-anchor="end">"Q3 revenue figures"</text>

  <circle cx="560" cy="365" r="6" fill="#f59e0b"/>
  <text x="570" y="365" class="point-label">"What did APAC bookings close at?"</text>

  <circle cx="535" cy="380" r="6" fill="#f59e0b"/>
  <text x="525" y="395" class="point-label" text-anchor="end">"Pipeline value this quarter"</text>

  <!-- Note -->
  <text x="400" y="468" class="note" text-anchor="middle">Different words, same meaning → close together. This is how a system finds the right document without keyword matching.</text>
</svg>
