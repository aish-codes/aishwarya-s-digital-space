<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #555; }
    .sentence { font-size: 18px; fill: #1a1a1a; }
    .token-text { font-size: 15px; font-weight: 500; fill: #fff; }
    .label { font-size: 12px; fill: #555; }
    .count { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .arrow { stroke: #888; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Title -->
  <text x="400" y="32" class="title" text-anchor="middle">How text becomes tokens</text>
  <text x="400" y="52" class="subtitle" text-anchor="middle">The unit every LLM measures, bills, and caps</text>

  <!-- Original sentence -->
  <text x="400" y="100" class="label" text-anchor="middle">Original text</text>
  <rect x="120" y="110" width="560" height="44" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="400" y="138" class="sentence" text-anchor="middle">The SharePoint list has 500 rows.</text>

  <!-- Arrow down -->
  <path d="M 400 165 L 400 195" class="arrow" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>

  <!-- Token boxes -->
  <text x="400" y="220" class="label" text-anchor="middle">After tokenization</text>

  <!-- Token 1: The -->
  <rect x="75"  y="235" width="55" height="36" rx="5" fill="#2563eb"/>
  <text x="102" y="259" class="token-text" text-anchor="middle">The</text>

  <!-- Token 2: " Share" -->
  <rect x="140" y="235" width="75" height="36" rx="5" fill="#7c3aed"/>
  <text x="178" y="259" class="token-text" text-anchor="middle">Share</text>

  <!-- Token 3: "Point" -->
  <rect x="225" y="235" width="65" height="36" rx="5" fill="#7c3aed"/>
  <text x="258" y="259" class="token-text" text-anchor="middle">Point</text>

  <!-- Token 4: " list" -->
  <rect x="300" y="235" width="55" height="36" rx="5" fill="#2563eb"/>
  <text x="328" y="259" class="token-text" text-anchor="middle">list</text>

  <!-- Token 5: " has" -->
  <rect x="365" y="235" width="55" height="36" rx="5" fill="#2563eb"/>
  <text x="393" y="259" class="token-text" text-anchor="middle">has</text>

  <!-- Token 6: " 500" -->
  <rect x="430" y="235" width="55" height="36" rx="5" fill="#059669"/>
  <text x="458" y="259" class="token-text" text-anchor="middle">500</text>

  <!-- Token 7: " rows" -->
  <rect x="495" y="235" width="65" height="36" rx="5" fill="#2563eb"/>
  <text x="528" y="259" class="token-text" text-anchor="middle">rows</text>

  <!-- Token 8: "." -->
  <rect x="570" y="235" width="36" height="36" rx="5" fill="#dc2626"/>
  <text x="588" y="259" class="token-text" text-anchor="middle">.</text>

  <!-- Result row -->
  <text x="400" y="307" class="count" text-anchor="middle">8 tokens</text>
  <text x="400" y="325" class="label" text-anchor="middle">Notice "SharePoint" splits into two tokens. Numbers, punctuation, and word fragments each count.</text>

  <!-- Legend -->
  <rect x="160" y="338" width="10" height="10" fill="#2563eb"/>
  <text x="175" y="347" class="label">whole word</text>
  <rect x="260" y="338" width="10" height="10" fill="#7c3aed"/>
  <text x="275" y="347" class="label">word fragment</text>
  <rect x="385" y="338" width="10" height="10" fill="#059669"/>
  <text x="400" y="347" class="label">number</text>
  <rect x="465" y="338" width="10" height="10" fill="#dc2626"/>
  <text x="480" y="347" class="label">punctuation</text>
</svg>
