<!--
  Source for public/og-image.png (the social link-preview card).
  Edit this file, then run `npm run og` to regenerate the PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D4757" />
      <stop offset="100%" stop-color="#2B3340" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- soft decorative orbs, echoing the hero section -->
  <circle cx="1010" cy="140" r="170" fill="#8A97AB" opacity="0.10" />
  <circle cx="1120" cy="520" r="210" fill="#8A97AB" opacity="0.07" />

  <!-- accent rule -->
  <rect x="90" y="196" width="64" height="6" rx="3" fill="#F7F8FA" opacity="0.85" />

  <text x="90" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" fill="#F7F8FA" letter-spacing="-2">Aishwarya</text>

  <text x="90" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="500" fill="#C3CBD8">AI Engineer</text>

  <text x="90" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="400" fill="#9AA5B5">LLMs · RAG · Python · R · Alteryx · Azure AI</text>

  <text x="90" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="400" fill="#9AA5B5">Delhi, India</text>

  <!-- AS monogram badge, matching public/favicon.svg -->
  <g transform="translate(946, 236)">
    <rect width="164" height="164" rx="36" fill="#F7F8FA" opacity="0.10" />
    <text x="82" y="108" text-anchor="middle"
          font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="72" font-weight="700" letter-spacing="-4" fill="#F7F8FA">AS</text>
  </g>
</svg>
